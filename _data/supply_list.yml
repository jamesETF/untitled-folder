# French Bulldog Puppy Supply List. This file is the single source for BOTH outputs:
#   - the web page  French-Bulldog-Puppy-Supply-List.md  -> /french-bulldog-preparation-list/
#   - the PDF       ruby scripts/supply-list/build-pdf.rb -> uploads/Puppy_Supply_List.pdf
# To update: edit here, rebuild the PDF, then commit both.
# Images live in /uploads/supply-list/ (products/<slug>.webp for each item).
# Keep every `url`: most are Amazon affiliate links (tag ethicalfren09-20).
# Voice rule: say pup / puppy / furbaby in copy, never "dog".

